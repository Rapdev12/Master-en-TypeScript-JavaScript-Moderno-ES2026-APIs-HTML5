<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" type="module" defer></script>
    <title>Proyecto web</title>
</head>

<body>

    <div class="layaut">
        <!--Cabezera-->
        <header class="header">

            <div class="logo">
                <div class="play"></div>
            </div>

            <h1>Mis Peliculas</h1>

        </header>

        <!--Cabezera-->
        <nav class="nav">
            <ul>
                <li><a href="#">Inicio </a></li>
                <li><a href="#">Peliculas</a></li>
                <li><a href="#">Blog </a></li>
                <li><a href="#">Contacto </a></li>
            </ul>
        </nav>

        <!--contenido Principal-->

        <section id="content" class="content">
            <!--aqui van las peliculas-->
            <article class="peli-item">
                <h3 class="title">Batman 3</h3>
                <img src="css/img/7960_173x256.jpg" alt="">
                <p class="descripcion">Caballero de la sombras</p>
                <button class="edit">Editar</button>
                <button class="delete">Borrar</button>
            </article>


        </section>

        <!--barra lateral-->

        <aside class="lateral">

            <div class="search">
                <h3 class="title">Buscador</h3>
                <form action="">
                    <input type="text" id="search_field">
                    <button id="search">Buscar</button>
                </form>
            </div>

            <div class="add">
                <h3 class="title">Añadir pelicula</h3>
                <form action="">
                    <input type="text" id="title" aria-placeholder="Titulo">
                    <textarea id="descripcion" placeholder="Descripcion"></textarea>
                    <input id="imagen" type="file" accept="image/*">
                    <input type="submit" id="save" value="Guardar">
                </form>

            </div>
        </aside>

        <!--Pie de pagina-->

        <footer class="footer">
            &copy; Ronald Palacios
        </footer>


    </div>

</body>

</html>
