<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--Scripts-->
    <script src="main.js"></script>

    <!--Estilos-->
    <style>
        li[data-continentes="Europa"] {
            background-color: aqua;
            color: black;
            padding: 20px;

        }
        li[data-continentes="America Sur"] {

            text-align: center;

        li[data-continentes="Asia"] {

            text-align: center;

        li[data-continentes="Africa"] {

            color: white;
            padding: 20px;
            text-align: center;
        }
    </style>
    <title>Aprendiendo Apis para HTML</title>
</head>

<body>
    <h1>Atributos DATA</h1>

    <ul id="lista">
        <li data-continentes="Europa">Espana</li>
        <li data-continentes="America Sur">Brasil</li>
        <li data-continentes="America Norte">Estados Unidos</li>
        <li data-continentes="Europa">Alemania</li>

</html>
